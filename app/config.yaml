send_time: 09:00
friends: []
message:
  text: '[续火花吧]'
  search_friend: false
delays:
  min: 1.0
  max: 3.0
retry:
  max_attempts: 3
  interval_sec: 10
network:
  wait_timeout_min: 15
notify:
  webhook_url: ''
  remind_time: '22:30'
  auto_resend: true
  notify_on_fail: true
  notify_on_success: true
  mention_names: ''
browser:
  headless: false
  gpu: true
  profile_dir: data/profile
  login_timeout_sec: 180
log:
  dir: logs
  keep_days: 30
randomize_time: false
# 总开关（拨动开关）：关闭可暂停 1 天 / 多天 / 永久
master:
  enabled: true
  pause_until: ''
  permanent: false
# 冻结的好友（在列表中但不发送；双击好友行切换）
frozen_friends: []

load_gate:
  enabled: true
  cpu_max: 80
  gpu_max: 80
  interval_min: 5
  max_wait_min: 120
