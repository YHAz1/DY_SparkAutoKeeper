# ============ 抖音自动续火花 · 配置文件 ============
# 修改后保存即可，无需改代码

# 每天计划发送时间（24 小时制），需与任务计划程序触发时间一致
send_time: "23:16"

# 好友昵称列表（抖音消息页可搜索到的昵称，一行一个）
friends: []  # 填入你的好友抖音昵称（示例：- "好友昵称A"）

# 发送内容
message:
  # 发送的文字内容；抖音输入 [续火花] 会自动转为火花表情（无需点表情面板）
  text: "[续火花]"
  # 是否启用"联系人搜索"兜底（默认关闭！抖音网页版的搜索是 AI 全网搜索，
  # 会跳转到 AI 搜索界面；仅当确定网页版有独立联系人搜索入口时才打开）
  search_friend: false

# 拟人化延迟（秒）：模拟真人操作，降低风控概率
delays:
  min: 1.5
  max: 3.5

# 重试
retry:
  # 每个好友最多尝试次数
  max_attempts: 2
  # 失败后重试间隔（秒）
  interval_sec: 10

# 浏览器
browser:
  # 发送时是否无头运行。建议 false（有头更接近真人，风控概率更低）
  headless: false
  # GPU 渲染开关：true=开启（流畅，推荐）；false=纯软件渲染（更慢，但完全不占显卡，
  # 适合你的显卡正在跑论文模型等 GPU 任务时使用）
  gpu: true
  # 登录数据持久化目录（含 cookie，首次扫码后无需重复登录）
  profile_dir: "data/profile"
  # 登录等待超时（秒）：首次扫码登录时最长等待时间
  login_timeout_sec: 180

# 日志
log:
  dir: "logs"
  # 日志保留天数
  keep_days: 30
